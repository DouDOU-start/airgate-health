# 本文件由 backend/cmd/genmanifest 自动生成，请勿手工修改。

id: airgate-health
name: 健康监控插件
version: 0.2.0
description: AI 提供商健康监控：分组级黑盒探测、可用率/延迟聚合、对外公开状态页
author: AirGate
type: extension
min_core_version: 1.0.0
dependencies: []
config:
  - key: probe_interval_seconds
    type: int
    required: false
    default: "300"
    description: 周期性分组探测的最小间隔；每次探测都是真实的上游 API 请求，过小会浪费上游配额
  - key: probe_concurrency
    type: int
    required: false
    default: "4"
    description: 同时进行的分组探测上限
  - key: retention_days
    type: int
    required: false
    default: "30"
    description: group_health_probes 表的清理周期；聚合查询足以覆盖 7/15/30 天窗口
  - key: public_status_enabled
    type: bool
    required: false
    default: "true"
    description: 开启后 /status 路由对外公开（无需登录），暴露脱敏的分组维度聚合
